name: Concept preview sync (temporary)
on:
  push:
    branches:
      - feat/concept-pixel-rgb-final-refinement
    paths:
      - .github/workflows/concept-preview-once.yml
      - templates/html/concept.html
permissions:
  contents: write
jobs:
  update-concept-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/concept-pixel-rgb-final-refinement
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Render actual 1600px Pretendard preview with all six checks
        run: python scripts/validate_references.py --templates concept
      - name: Commit only canonical concept screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/html-concept.png
          if ! git diff --cached --quiet; then
            git commit -m "chore(concept): update Chromium preview"
            git push origin HEAD:feat/concept-pixel-rgb-final-refinement
          fi
