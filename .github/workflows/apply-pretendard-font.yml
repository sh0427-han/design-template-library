name: Validate Pretendard Default

on:
  push:
    branches:
      - design/concept-architecture-figure-refinement
    paths:
      - templates/html/styles.css
      - templates/html/executive-summary.html
      - templates/dual-mode-learning/assets/css/tokens.css
      - scripts/verify_pretendard.py
      - scripts/render_previews.py
      - .github/workflows/apply-pretendard-font.yml
  workflow_dispatch:

# Serialize preview writers for the same branch to prevent non-fast-forward races.
concurrency:
  group: html-preview-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify all 8 templates and regenerate 8 previews
        run: python scripts/render_previews.py --evidence-dir /tmp/pretendard-browser
      - name: Verify gallery, Scroll/Slide and regenerate dual-mode previews
        run: python scripts/verify_pretendard.py
      - name: Save refreshed HTML previews to the PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/html-*.png previews/html-*.jpg previews/dual-mode-*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh HTML previews with default Pretendard"
            for attempt in 1 2 3; do
              git fetch origin "${{ github.ref_name }}"
              git rebase "origin/${{ github.ref_name }}"
              if git push origin HEAD:${{ github.ref_name }}; then
                exit 0
              fi
              sleep 2
            done
            echo "Unable to push previews after 3 attempts" >&2
            exit 1
          fi
