name: Render Concept and Architecture

on:
  push:
    branches:
      - design/concept-architecture-figure-refinement
    paths:
      - templates/html/concept.html
      - templates/html/architecture.html
      - scripts/render_selected_previews.py
      - .github/workflows/render-concept-architecture.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate four viewports and capture previews
        run: python scripts/render_selected_previews.py
      - name: Save rendered evidence on this PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/html-concept.png previews/html-architecture.jpg previews/review/concept-architecture-validation.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update verified Concept and Architecture screenshots"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            git push origin HEAD:${{ github.ref_name }}
          fi
