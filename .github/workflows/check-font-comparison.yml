name: Check Font Comparison

on:
  push:
    branches:
      - design/concept-architecture-figure-refinement
    paths:
      - templates/html/font-comparison.html
      - scripts/check_font_comparison.py
      - .github/workflows/check-font-comparison.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify font injection, toggles, responsive behavior
        run: python scripts/check_font_comparison.py
