name: Validate Final HTML References
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'integration/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: final-html-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Pinned D0 commit is required for source identity checks.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright Pillow
      - run: python -m playwright install --with-deps chromium
      - name: Syntax and shared token checks
        run: |
          python scripts/check_sources.py
          python scripts/verify_character_spacing.py
          python templates/dual-mode-learning/tools/check.py
      - name: Eight references, real fonts and six viewports
        run: python scripts/validate_references.py
      - name: Interactive boundary states and reuse
        run: python scripts/check_interactive.py
      - name: Gallery and Scroll / Slide regression
        run: python scripts/verify_pretendard.py
      - name: Logistic regression Markdown reuse pilot
        run: python scripts/verify_logistic_reuse.py
      - name: Gradient descent D0/D1 reuse validation
        run: python scripts/verify_gradient_descent.py
      - name: Markdown links and final design contracts
        run: python scripts/check_documentation.py
      - name: Heading hierarchy preview, nine sources and both modes
        run: python scripts/verify_heading_roles.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-html-reference-evidence
          path: |
            previews/html-*.png
            previews/html-*.jpg
            previews/dual-mode-*.jpg
            previews/review/*validation.json
            /tmp/reference-integration-review
            /tmp/dual-mode-review
            examples/logistic-regression/previews
            /tmp/logistic-reuse-review
            examples/gradient-descent/previews
            /tmp/gradient-descent-review
            previews/heading-review
      - name: Transfer heading preview evidence
        if: always()
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import base64
          files=list(Path('previews').glob('html-*.png'))+list(Path('previews').glob('html-*.jpg'))
          files += [Path('previews')/n for n in ['dual-mode-scroll.jpg','dual-mode-slide.jpg']]
          files += [Path('previews/review')/n for n in ['reference-validation.json','interactive-validation.json','dual-mode-validation.json']]
          files += [Path('previews/heading-review')/n for n in ['index.html','overfitting.png','contact.jpg','validation.json']]
          for f in files:
              if f.exists():print('HEADING_EVIDENCE '+str(f)+' '+base64.b64encode(f.read_bytes()).decode())
          PYTHON
