<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>과적합과 일반화 · 개념</title>
<link rel="stylesheet" href="../../templates/html/styles.css">
<link rel="stylesheet" href="../../templates/html/reference-layout.css">
<link rel="stylesheet" href="../../templates/html/math-typography.css">
<link rel="stylesheet" href="lesson.css"><script src="curves.js" defer></script></head>
<body class="source-page"><main><section class="slide reference-slide overfit-slide" aria-labelledby="lesson-title">
<header><div class="kicker">머신러닝 기초</div><h1 id="lesson-title">과적합과 일반화</h1><p class="subtitle">학습 데이터로 학습 · 학습에 쓰지 않은 검증 데이터로 성능 확인 · 손실(Loss): 예측 오차의 크기</p></header>
<div class="content">
<div class="definition-grid">
<article class="card definition" aria-labelledby="overfit-title"><h2 id="overfit-title">과적합 <span lang="en">Overfitting</span></h2><p class="meaning">학습 데이터의 특성·잡음에 지나치게 맞춰<br>새로운 데이터에서 성능이 저하되는 <b>현상</b></p></article>
<article class="card definition" aria-labelledby="general-title"><h2 id="general-title">일반화 <span lang="en">Generalization</span></h2><p class="meaning">학습에 쓰지 않은 새로운 데이터에서도<br>잘 동작하는 <b>능력</b></p></article>
</div>
<section class="loss-panel" aria-label="과적합과 일반화의 손실 곡선 비교">
<figure class="curve-panel" aria-labelledby="overfit-heading">
<div class="legend"><span><i class="training-key"></i>학습 손실</span><span><i class="validation-key"></i>검증 손실</span></div>
<svg id="overfit-chart" class="loss-chart" viewBox="0 0 380 320" role="img" aria-labelledby="overfit-chart-title overfit-chart-desc"><title id="overfit-chart-title">검증 손실 상승은 과적합의 단서</title><desc id="overfit-chart-desc">같은 기준의 학습 손실과 검증 손실을 비교하는 개념도. 실제 측정 결과가 아님.</desc>
<text id="overfit-heading" class="case-heading" x="190" y="22" text-anchor="middle">검증 손실 상승은 과적합의 단서</text>
<path class="axis" d="M46 58V266H358"/>
<text class="axis-title" x="46" y="50">평균 손실</text><text class="math-number zero" x="35" y="272" text-anchor="end">0</text><text class="axis-title" x="202" y="307" text-anchor="middle">학습 진행</text><text class="direction" x="358" y="287" text-anchor="end">많아짐</text>
<g class="curve-artwork"><path id="overfit-training-line" class="training-line"/><path id="overfit-validation-line" class="validation-line"/></g></svg>
</figure><figure class="curve-panel" aria-labelledby="generalization-heading">
<div class="legend"><span><i class="training-key"></i>학습 손실</span><span><i class="validation-key"></i>검증 손실</span></div>
<svg id="generalization-chart" class="loss-chart" viewBox="0 0 380 320" role="img" aria-labelledby="generalization-chart-title generalization-chart-desc"><title id="generalization-chart-title">새 데이터에서도 낮은 손실</title><desc id="generalization-chart-desc">같은 기준의 학습 손실과 검증 손실을 비교하는 개념도. 실제 측정 결과가 아님.</desc>
<text id="generalization-heading" class="case-heading" x="190" y="22" text-anchor="middle">새 데이터에서도 낮은 손실</text>
<path class="axis" d="M46 58V266H358"/>
<text class="axis-title" x="46" y="50">평균 손실</text><text class="math-number zero" x="35" y="272" text-anchor="end">0</text><text class="axis-title" x="202" y="307" text-anchor="middle">학습 진행</text><text class="direction" x="358" y="287" text-anchor="end">많아짐</text>
<g class="curve-artwork"><path id="generalization-training-line" class="training-line"/><path id="generalization-validation-line" class="validation-line"/></g></svg>
</figure>
<p id="chart-status" role="status">곡선을 불러오는 중</p></section>
<div class="ref-takeaway"><strong>핵심</strong><span>낮은 학습 손실만으로 새 데이터의 오차가 작다고 보장할 수 없음</span></div>
</div><footer class="footer"><span>머신러닝 기초 · 과적합과 일반화</span><span>01 / 01</span></footer>
</section></main></body></html>
