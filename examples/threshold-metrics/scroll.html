<script>
window.showLessonScriptError = function () {
  const root = document.getElementById('lesson');
  if (!root) return;
  root.replaceChildren();
  const message = document.createElement('p');
  message.className = 'loading-state';
  message.textContent = '필수 스크립트를 불러오지 못했습니다. JavaScript와 파일 로드를 확인한 뒤 새로고침해 주세요. ';
  const retry = document.createElement('button');
  retry.type = 'button'; retry.textContent = '다시 불러오기';
  retry.addEventListener('click', function () { location.reload(); });
  message.appendChild(retry); root.appendChild(message);
  root.setAttribute('aria-busy', 'false'); document.body.dataset.ready = 'error';
};
</script>
<script src="model.js" defer onerror="showLessonScriptError()"></script><script src="app.js" defer onerror="showLessonScriptError()"></script>
