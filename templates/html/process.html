<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Process | Design Template Library</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="reference-layout.css">
<style>
.process-slide .process-photo-icon {display:flex;align-items:center;justify-content:center}
.process-slide .process-photo-icon img {width:80px;height:80px;object-fit:cover;border-radius:4px}
.process-slide .feature-symbol {width:116px;height:94px;margin-bottom:7px}
.process-slide .process-feature-svg {height:94px;width:116px;display:block;overflow:visible}
</style></head>
<body><main class="deck reference-deck"><section class="slide reference-slide process-slide" aria-label="CNN 데이터 흐름">
  <header><div class="ref-overline"><div class="kicker">PROCESS / 02</div></div><h1>CNN의 예측 흐름</h1><p class="subtitle">이미지 → 특징 추출 → 목적별 처리 → 예측 결과</p></header>
  <div class="content" style="flex-direction:column;justify-content:center">
    <div class="flow">
      <div class="node"><div class="node-step">INPUT</div><div class="process-symbol process-photo-icon"><img src="assets/concept-apple-photo.jpg" alt="" loading="eager"></div><div class="node-title">입력 이미지</div><div class="node-desc">RGB 픽셀 데이터</div></div><div class="flow-arrow" aria-hidden="true">→</div>
      <div class="node feature"><div class="node-step">FEATURE</div><div class="process-symbol feature-symbol" aria-hidden="true"><svg class="process-feature-svg" viewBox="0 0 132 115" focusable="false"><rect x="15" y="22" width="76" height="76" rx="3" fill="#bdd3f6" stroke="#6391c9"></rect></svg></div><div class="node-title">CNN</div><div class="node-desc">계층적 특징 추출</div></div><div class="flow-arrow" aria-hidden="true">→</div>
      <div class="node"><div class="node-step">TASK</div><svg class="process-symbol" viewBox="0 0 100 80" aria-hidden="true"><path d="M20 16L80 40M20 40H80M20 64L80 40" fill="none" stroke="currentColor" stroke-width="3"/><g fill="currentColor"><circle cx="20" cy="16" r="7"/><circle cx="20" cy="40" r="7"/><circle cx="20" cy="64" r="7"/><circle cx="80" cy="40" r="10"/></g></svg><div class="node-title">Task Head</div><div class="node-desc">분류 등 목적별 처리</div></div><div class="flow-arrow" aria-hidden="true">→</div>
      <div class="node output"><div class="node-step">OUTPUT</div><div class="process-symbol output-symbol" aria-hidden="true"><i></i><i></i><i></i></div><div class="node-title">예측 결과</div><div class="node-desc">클래스 점수 등</div></div>
    </div><div class="insight ref-takeaway"><strong>역할 분리</strong> &nbsp; 특징 추출기: 이미지 표현 학습 · Task head: 목적에 맞는 출력 변환</div>
  </div>
  <footer class="footer"><span>Design Template Library · Process</span><span>02 / 08</span></footer>
</section></main><script src="assets/cnn-feature-maps.js" defer></script></body></html>
