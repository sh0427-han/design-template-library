<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Concept | Design Template Library</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="reference-layout.css">
  <style>
    /* #1 Concept: page-scoped, single-source styles; shared tokens stay global. */
    .concept-slide {
      padding:54px 66px 30px;
      color:var(--ink);
      background:var(--canvas);
    }
    .concept-slide h1 { margin:7px 0 6px; font-size:49px; line-height:1.13; }
    .concept-slide .subtitle { font-size:21px; line-height:1.38; }
    .concept-stage {
      display:grid;
      grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);
      gap:25px;
      flex:1;
      min-height:0;
      margin-top:25px;
    }
    .concept-panel {
      display:flex;
      flex-direction:column;
      min-width:0;
      min-height:0;
      padding:22px 26px;
      background:var(--white);
      border:1px solid var(--border);
      border-radius:18px;
    }
    .concept-panel .panel-head h2 {
      margin:0;
      color:var(--navy);
      font-size:23px;
      font-weight:800;
    }
    .image-figure {
      display:grid;
      grid-template-columns:minmax(0,1fr) 42px minmax(0,1fr);
      align-items:center;
      gap:5px;
      flex:1;
      min-height:0;
      margin-top:14px;
    }
    .figure-unit {
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:12px;
      min-width:0;
      width:100%;
      height:100%;
    }
    .image-frame,.pixel-frame {
      display:grid;
      place-items:center;
      width:100%;
      height:274px;
      min-width:0;
    }
    .photo-wrap {
      position:relative;
      width:min(100%,262px);
      aspect-ratio:1;
    }
    .concept-photo {
      display:block;
      width:100%;
      height:100%;
      object-fit:contain;
    }
    .photo-roi {
      position:absolute;
      left:65%;
      top:47.5%;
      width:5%;
      height:5%;
      box-sizing:border-box;
      border:2px solid var(--white);
      box-shadow:0 0 0 1.5px var(--navy);
      pointer-events:none;
    }
    .zoom-arrow {
      display:grid;
      place-items:center;
      width:100%;
      height:274px;
      min-width:0;
      transform:translateY(-16.5px);
      color:var(--blue);
    }
    .zoom-arrow svg { display:block; width:35px; height:24px; }
    .figure-label {
      color:var(--deep);
      text-align:center;
      font-size:17px;
      font-weight:800;
      line-height:1.25;
      white-space:nowrap;
    }
    .pixel-block {
      display:grid;
      grid-template-columns:repeat(4,50px);
      grid-template-rows:repeat(4,50px);
      gap:3px;
    }
    .pixel-block span {
      display:block;
      width:50px;
      height:50px;
      background:#e9eef5;
      border:1px solid #ffffffcc;
      border-radius:1px;
    }
    .pixel-block .selected {
      position:relative;
      z-index:1;
      outline:3px solid var(--navy);
      outline-offset:1px;
    }
    .pixel-block .selected::after,
    .selected-color .swatch::after {
      content:"";
      position:absolute;
      top:-5px;
      right:-5px;
      width:7px;
      height:7px;
      border:1px solid var(--white);
      border-radius:50%;
      background:var(--navy);
    }
    .value-panel { justify-content:space-between; gap:14px; }
    .selected-color {
      display:flex;
      align-items:center;
      gap:17px;
      min-width:0;
      padding:13px 16px;
      background:#f7f9fd;
      border:1px solid var(--border);
      border-radius:13px;
    }
    .selected-color .swatch {
      position:relative;
      width:64px;
      height:45px;
      flex:0 0 auto;
      border:2px solid var(--navy);
      border-radius:8px;
      background:#dbe4f0;
    }
    .selected-color strong {
      display:block;
      color:var(--navy);
      font-size:22px;
      line-height:1.25;
    }
    .selected-color small {
      display:block;
      margin-top:2px;
      color:var(--muted);
      font-size:14px;
      line-height:1.4;
    }
    .channel-values {
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:11px;
    }
    .channel-value {
      min-width:0;
      padding:12px 13px;
      background:#f7f9fd;
      border:1px solid var(--border);
      border-radius:13px;
    }
    .channel-value .head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      color:var(--deep);
      font-size:17px;
      font-weight:800;
    }
    .channel-value .dot { width:15px; height:15px; border-radius:50%; }
    .channel-value .number {
      margin-top:6px;
      color:var(--navy);
      font-size:29px;
      font-weight:800;
      font-variant-numeric:tabular-nums;
    }
    .channel-value .track {
      height:7px;
      margin-top:8px;
      background:#e0e8f1;
      border-radius:7px;
      overflow:hidden;
    }
    .channel-value .bar { width:0; height:100%; border-radius:7px; }
    .tensor-shape {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:16px 17px;
      background:var(--pale-blue);
      border:1px solid #cadef8;
      border-radius:13px;
    }
    .tensor-shape .formula {
      color:var(--navy);
      font-size:31px;
      font-weight:800;
      white-space:nowrap;
    }
    .tensor-shape .channel-count { color:var(--blue); }
    .tensor-shape .label {
      color:var(--deep);
      font-size:15px;
      line-height:1.43;
      text-align:right;
    }
    .concept-slide .concept-takeaway {
      flex:0 0 auto;
      margin-top:14px;
    }
    .concept-slide .footer {
      flex:0 0 auto;
      margin-top:15px;
      padding-top:11px;
      font-size:14px;
    }
    @media (max-width:900px) {
      .concept-stage { grid-template-columns:minmax(0,1fr); gap:20px; }
      .reference-slide.concept-slide .concept-panel { padding:20px; }
      .reference-slide.concept-slide .image-figure { min-height:290px; }
      .reference-slide.concept-slide .image-frame,
    .reference-slide.concept-slide .pixel-frame,
    .reference-slide.concept-slide .zoom-arrow { height:256px; }
    }
    @media (max-width:520px) {
      /* Give the grid a definite viewport-width track; auto tracks shrink to 238px. */
      .concept-deck { width:100%; grid-template-columns:minmax(0,1fr); }
      .reference-slide.concept-slide { width:calc(100vw - 20px); }
      .reference-slide.concept-slide .concept-panel { padding:18px; }
      /* Vertical expansion is legible even when the host uses a narrow grid track. */
      .reference-slide.concept-slide .image-figure {
        grid-template-columns:minmax(0,1fr);
        grid-template-rows:auto 28px auto;
        gap:10px;
        min-height:0;
        margin-top:8px;
      }
      .figure-unit { height:auto; gap:10px; }
      .reference-slide.concept-slide .image-frame,
      .reference-slide.concept-slide .pixel-frame { height:172px; }
      .reference-slide.concept-slide .zoom-arrow {
        height:28px;
        transform:none;
      }
      .reference-slide.concept-slide .image-unit { width:100%; }
      .photo-wrap { width:min(100%,160px); }
      .reference-slide.concept-slide .pixel-block {
        grid-template-columns:repeat(4,28px);
        grid-template-rows:repeat(4,28px);
        gap:2px;
      }
      .reference-slide.concept-slide .pixel-block span { width:28px; height:28px; }
      .zoom-arrow svg { width:21px; height:20px; transform:rotate(90deg); }
      .reference-slide.concept-slide .figure-label { font-size:14px; white-space:normal; }
      .selected-color { gap:12px; padding:12px; }
      .selected-color .swatch { width:52px; height:42px; }
      .selected-color strong { font-size:20px; }
      .selected-color small { font-size:12px; }
      .channel-values { gap:7px; }
      .channel-value { padding:10px 9px; }
      .channel-value .number { font-size:25px; }
      .tensor-shape { flex-wrap:wrap; }
      .tensor-shape .formula { font-size:27px; }
      .tensor-shape .label { text-align:left; }
    }
  </style>
</head>
<body>
<main class="deck reference-deck concept-deck">
  <section class="slide concept-slide reference-slide" aria-label="Concept 레퍼런스" data-sampled="loading">
    <header>
      <div class="ref-overline"><div class="kicker">CONCEPT / 01</div></div>
      <h1>이미지의 숫자 구조</h1>
      <p class="subtitle">픽셀 색상은 8-bit RGB 세 값으로, 이미지 전체는 높이 × 너비 × 채널로 표현</p>
    </header>
    <div class="concept-stage">
      <article class="concept-panel visual-panel" aria-label="사과 이미지의 픽셀 표현">
        <div class="panel-head"><h2>이미지 → 픽셀</h2></div>
        <div class="image-figure">
          <div class="figure-unit image-unit">
            <div class="image-frame" role="img" aria-label="사과 사진과 선택 영역">
            <div class="photo-wrap" role="img" aria-label="실사형 사과 이미지에서 선택한 정사각형 영역">
              <img src="assets/concept-apple-photo.jpg" id="concept-image" class="concept-photo" width="540" height="540" alt="밝은 배경에 놓인 붉은 사과" />
              <span class="photo-roi" aria-hidden="true"></span>
            </div>
            </div>
            <span class="figure-label">입력 이미지</span>
          </div>
          <span class="zoom-arrow" aria-hidden="true"><svg viewBox="0 0 42 24" fill="none"><path d="M2 12 H37 M29 4 L37 12 L29 20" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <div class="figure-unit pixel-unit">
            <div class="pixel-frame">
              <div class="pixel-block" role="img" aria-label="사과의 빨간 영역을 확대해 표현한 4 곱하기 4 픽셀 배열"><span></span><span></span><span></span><span></span><span></span><span></span><span class="selected" data-selected-index="6"></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
            </div>
            <span class="figure-label">픽셀 확대 (4×4)</span>
          </div>
        </div>
              </article>
      <article class="concept-panel value-panel">
        <div class="panel-head"><h2>선택 픽셀의 RGB 값</h2></div>
        <div class="selected-color"><span class="swatch" role="img" aria-label="선택된 픽셀과 동일한 색상"></span><div><strong><span id="selected-rgb">RGB 값 계산 중</span></strong><small>HEX &nbsp;<span id="selected-hex">—</span> · 채널 범위 0–255</small></div></div>
        <div class="channel-values">
          <div class="channel-value"><div class="head">R <span class="dot" style="background:#e8695c"></span></div><div class="number">—</div><div class="track"><div class="bar" style="background:#e8695c"></div></div></div>
          <div class="channel-value"><div class="head">G <span class="dot" style="background:#5db88b"></span></div><div class="number">—</div><div class="track"><div class="bar" style="background:#5db88b"></div></div></div>
          <div class="channel-value"><div class="head">B <span class="dot" style="background:#558ecb"></span></div><div class="number">—</div><div class="track"><div class="bar" style="background:#558ecb"></div></div></div>
        </div>
        <div class="tensor-shape"><span class="formula">H × W × <span class="channel-count">3</span></span><span class="label">높이 × 너비 × RGB 채널<br><strong>이미지 텐서</strong></span></div>
      </article>
    </div>
    <div class="concept-takeaway ref-takeaway"><strong>핵심 개념</strong><span>픽셀 하나 → RGB 3개 값 &nbsp;·&nbsp; 이미지 전체 → 3차원 배열(HWC)</span></div>
    <footer class="footer"><span>Design Template Library · Concept</span><span>01 / 08</span></footer>
  </section>
</main>

<script>
/* The 4×4 swatches and selected channel values share one 80×80 canvas raster. */
(async () => {
  const image = document.getElementById('concept-image');
  const slide = document.querySelector('.concept-slide');
  const selected_index = 6;
  const cells = [...document.querySelectorAll('.pixel-block span')];
  const channels = [...document.querySelectorAll('.channel-value')];
  const rgb_label = document.getElementById('selected-rgb');
  const hex_label = document.getElementById('selected-hex');
  const swatch = document.querySelector('.selected-color .swatch');

  try {
    await image.decode();
    if (!image.naturalWidth || !image.naturalHeight) {
      throw new Error('Source photograph is unavailable');
    }
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 80;
    const ctx = canvas.getContext('2d', {willReadFrequently:true});
    if (!ctx) throw new Error('Canvas 2D context is unavailable');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(image, 0, 0, 80, 80);

    const rgba = ctx.getImageData(52, 38, 4, 4).data;
    const colors = Array.from({length:16}, (_,i) =>
      [rgba[i*4],rgba[i*4+1],rgba[i*4+2]]);
    if (colors.length !== cells.length || selected_index >= colors.length ||
        colors.some(color => color.some(value => !Number.isInteger(value) ||
            value < 0 || value > 255))) {
      throw new Error('Invalid 4×4 RGB sample');
    }

    const selected = colors[selected_index];
    const rgb = 'rgb(' + selected.join(',') + ')';
    const hex = '#' + selected.map(value =>
      value.toString(16).padStart(2,'0')).join('').toUpperCase();

    cells.forEach((cell,index) => {
      cell.style.backgroundColor = 'rgb(' + colors[index].join(',') + ')';
      cell.title = 'RGB (' + colors[index].join(', ') + ')';
    });
    swatch.style.backgroundColor = rgb;
    rgb_label.textContent = 'RGB (' + selected.join(', ') + ')';
    hex_label.textContent = hex;
    channels.forEach((node,index) => {
      node.querySelector('.number').textContent = selected[index];
      node.querySelector('.bar').style.width = (100 * selected[index] / 255) + '%';
    });
    slide.dataset.sampled = 'true';
  } catch (error) {
    rgb_label.textContent = '이미지 픽셀 읽기 실패';
    hex_label.textContent = '—';
    cells.forEach(cell => { cell.title = '원본 이미지 읽기 실패'; });
    channels.forEach(node => {
      node.querySelector('.number').textContent = '—';
      node.querySelector('.bar').style.width = '0%';
    });
    swatch.style.backgroundColor = '#dbe4f0';
    slide.dataset.sampled = 'error';
    console.error(error);
  }
})();
</script>
</body>
</html>
